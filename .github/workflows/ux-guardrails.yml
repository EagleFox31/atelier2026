name: UX guardrails

# Garde-fous UX/UI/CX AVANT merge : Playwright sur un build de production local,
# API entièrement simulée (e2e-ux/). Le smoke test quotidien contre la prod reste
# qa-ux.yml (e2e-qa/).
#
# RAIDER — change-scoped execution : le workflow démarre sur chaque PR, mais le
# job Playwright ne tourne que si l'analyse d'impact AppFactory requiert le gate
# « ux-guardrails » (front, e2e-ux/, dépendances, prisma, ce workflow… — voir
# .github/appfactory-impact.json). Sinon il est « skipped », ce qui ne bloque pas
# une PR même si ce check devient obligatoire (contrairement à un filtre paths:
# qui laisserait le check en attente).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ux-guardrails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  impact:
    name: Analyse d'impact
    # Même runtime AppFactory épinglé que ci.yml (main @ 20c6b99, pas encore de tag).
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-impact-analysis.yml@20c6b99e8dd063a1cac72a5fc2cfa38829a1b899
    with:
      appfactory_ref: 20c6b99e8dd063a1cac72a5fc2cfa38829a1b899
      config_path: .github/appfactory-impact.json
      mode: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'auto' }}

  playwright-ux:
    name: Playwright UX guardrails
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'ux-guardrails') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # next build vérifie les types de tout le projet (dont lib/prisma.ts) :
      # le client Prisma doit exister, comme dans ci.yml et Dockerfile.web.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UX guardrails (build + next start, API simulée)
        run: npm run test:ux
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ux-report
          path: |
            reports/playwright-ux
            test-results
          if-no-files-found: ignore
          retention-days: 14
