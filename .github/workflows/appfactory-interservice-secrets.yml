name: AppFactory · Atelier Notify interservice credential

# Manual-only provisioning. Never runs for PRs, pushes, or automatically during
# a release. GitHub OIDC is scoped to this exact workflow on protected main.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: atelier-notify-interservice-key-production
  cancel-in-progress: false

jobs:
  reconcile:
    name: Synchronize existing SSM key with Notify via AppFactory
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - name: Authenticate to AWS with short-lived GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-3
          role-session-name: atelier-notify-secret-reconcile

      - name: Resolve SSM SecureString and reconcile Cloudflare through AppFactory
        shell: bash
        env:
          PARAMETER: /atelier-maitre/prod/notify-ingest-key
          BROKER_URL: https://appfactory-api.lawrynnjennifer.workers.dev/infrastructure/interservice-secret
          GITHUB_AUDIENCE: appfactory-api
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          key_path="$temp_dir/key"
          payload_path="$temp_dir/request.json"
          response_path="$temp_dir/response.json"

          # An existing SecureString is the source of truth. Never rotate it.
          if aws ssm get-parameter --name "$PARAMETER" --with-decryption \
            --query 'Parameter.Value' --output text > "$key_path" 2>"$temp_dir/aws-error"; then
            python3 - "$key_path" <<'PY'
          import pathlib, re, sys
          path=pathlib.Path(sys.argv[1])
          value=path.read_text().rstrip("\r\n")
          if not re.fullmatch(r"[0-9a-f]{64}",value):
              raise SystemExit("Existing SSM key has unexpected format; refusing to rotate.")
          path.write_text(value)
          PY
            echo "Reusing existing SSM SecureString."
          elif grep -q 'ParameterNotFound' "$temp_dir/aws-error"; then
            python3 - "$key_path" <<'PY'
          import pathlib,secrets,sys
          pathlib.Path(sys.argv[1]).write_text(secrets.token_hex(32))
          PY
            # No --overwrite: a concurrent or existing parameter is protected.
            aws ssm put-parameter --name "$PARAMETER" --type SecureString \
              --value "file://$key_path" --query Version --output text >/dev/null
            echo "SSM SecureString created."
          else
            echo "AWS SSM GetParameter denied or failed (requires scoped GetParameter/PutParameter)." >&2
            exit 1
          fi

          # Verify actual SSM persistence; don't log values or export to GITHUB_OUTPUT.
          aws ssm get-parameter --name "$PARAMETER" --with-decryption \
            --query 'Parameter.Value' --output text > "$temp_dir/verified"
          python3 - "$key_path" "$temp_dir/verified" <<'PY'
          import pathlib,sys
          a=pathlib.Path(sys.argv[1]).read_text().strip()
          b=pathlib.Path(sys.argv[2]).read_text().strip()
          if a!=b: raise SystemExit("SSM key mismatch; no Cloudflare write attempted.")
          PY

          # Request a fresh audience-limited OIDC JWT (never persist it as output).
          auth_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${GITHUB_AUDIENCE}"
          oidc="$(curl --fail --silent --show-error -H \
            "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$auth_url" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"

          python3 - "$key_path" "$payload_path" <<'PY'
          import json,pathlib,sys
          key=pathlib.Path(sys.argv[1]).read_text()
          payload={"repository":"EagleFox31/atelier2026",
                   "contract":"atelier-notify:staging-v1","key":key}
          pathlib.Path(sys.argv[2]).write_text(json.dumps(payload))
          PY

          status="$(curl --silent --show-error --output "$response_path" \
            --write-out '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer ${oidc}" \
            -H "Content-Type: application/json" \
            --data-binary "@$payload_path" "$BROKER_URL")"
          unset oidc
          if [ "$status" != 200 ]; then
            # Only expose the fixed broker error code, never request or response data.
            reason="$(jq -r '.error // "BROKER_UNAVAILABLE"' "$response_path" 2>/dev/null || true)"
            echo "AppFactory rejected the reconciliation: HTTP $status / ${reason:-unknown}" >&2
            exit 1
          fi
          jq -e '.status == "PROVISIONED" or .status == "ALREADY_CONFIGURED"' \
            "$response_path" >/dev/null
          echo "AWS SSM ↔ Notify key reconciliation confirmed by private proof endpoint."
