name: Deploy AWS

# Déploiement À LA RELEASE, pas à chaque merge (une seule coupure de 30 à 60 s,
# au moment choisi) :
# - merge d'une PR ordinaire sur main → CI verte → ce workflow s'arrête au job
#   « Release gate » : rien n'est déployé (résumé explicite, pas un faux vert) ;
# - merge de la PR de release AppFactory (version.txt modifié) → CI verte →
#   déploiement COMPLET du commit de release (les deux images, la pile, le runtime) ;
# - Run workflow (manuel) → déploiement complet de main, pour un correctif urgent.
# Tout reconstruire à la release supprime la détection de chemins par regex et ses
# trous (fichiers oubliés, plage limitée au dernier commit). Le cache Docker garde
# une image inchangée identique : son conteneur n'est alors pas recréé.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Seuls les candidats au déploiement entrent dans la file de production. Un run
# ordinaire (simple contrôle, quelques secondes) prend un groupe à lui : sinon,
# GitHub ne gardant qu'un seul run en attente par groupe, il pourrait évincer un
# déploiement de release en attente (LESSON-2026-011). Le filtre sur le message
# est large exprès : un faux positif ne fait qu'attendre son tour dans la file.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
         contains(github.event.workflow_run.head_commit.message, 'release'))
        && 'atelier-maitre-production'
        || format('deploy-gate-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3
  STACK_NAME: atelier-maitre-prod
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    # Une exécution manuelle de la CI (validation complète) ne doit pas redéployer
    # la prod : seuls les runs CI issus d'un push (ou d'un re-run) passent ici.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'workflow_dispatch')
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2

      # Commit de release = version.txt modifié par rapport au 1er parent (couvre
      # squash ET merge commit de la PR de release). version.txt n'est jamais
      # édité à la main : seule la PR de release AppFactory le change.
      - name: Decide
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            reason="déploiement manuel (Run workflow)"
            deploy=true
          elif ! git diff --quiet HEAD^1 HEAD -- version.txt; then
            reason="release v$(tr -d '[:space:]' < version.txt)"
            deploy=true
          else
            reason="commit hors release : la prod sera mise à jour au merge de la PR de release (ou via Run workflow)"
            deploy=false
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          {
            echo "### Release gate"
            echo "- Commit : \`${DEPLOY_SHA}\`"
            echo "- Déploiement : **$deploy** — $reason"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "deploy=$deploy ($reason)"

  provision:
    name: Provision AWS infrastructure
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      instance-id: ${{ steps.stack.outputs.instance-id }}
      public-ip: ${{ steps.stack.outputs.public-ip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: atelier-maitre-infra

      - name: Validate CloudFormation template
        run: aws cloudformation validate-template --template-body file://infra/aws/atelier-maitre.yml

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infra/aws/atelier-maitre.yml \
            --stack-name "$STACK_NAME" \
            --role-arn "${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides Environment=prod InstanceType=t3.micro RootVolumeSize=20 \
            --no-fail-on-empty-changeset

      - name: Read stack outputs
        id: stack
        run: |
          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue | [0]" \
            --output text)
          PUBLIC_IP=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='PublicIp'].OutputValue | [0]" \
            --output text)
          {
            echo "instance-id=$INSTANCE_ID"
            echo "public-ip=$PUBLIC_IP"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### AWS infrastructure"
            echo "- Instance: \`$INSTANCE_ID\`"
            echo "- Temporary URL: http://$PUBLIC_IP"
          } >> "$GITHUB_STEP_SUMMARY"

  build-push:
    name: Build and push GHCR images
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Set image names and version
        run: |
          OWNER="${{ github.repository_owner }}"
          # Version du commit déployé (version.txt, tenu à jour par la PR de release
          # AppFactory) — pas « le dernier tag du dépôt », qui peut viser un autre commit.
          VERSION=""
          if [ -f version.txt ]; then
            VERSION="v$(tr -d '[:space:]' < version.txt)"
          fi
          {
            echo "API_IMAGE=ghcr.io/${OWNER,,}/atelier2026-api"
            echo "WEB_IMAGE=ghcr.io/${OWNER,,}/atelier2026-web"
            echo "APP_VERSION=${VERSION:-dev}"
          } >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          push: true
          platforms: linux/amd64
          tags: ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          push: true
          platforms: linux/amd64
          tags: ${{ env.WEB_IMAGE }}:latest
          build-args: NEXT_PUBLIC_APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy application with Session Manager
    needs: [gate, provision, build-push]
    if: >-
      always() &&
      needs.gate.outputs.deploy == 'true' &&
      needs.provision.result == 'success' &&
      needs.build-push.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: atelier-maitre-app

      - name: Wait for Session Manager
        env:
          INSTANCE_ID: ${{ needs.provision.outputs.instance-id }}
        run: |
          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text)
            if [ "$STATUS" = "Online" ]; then
              exit 0
            fi
            echo "Waiting for Session Manager ($attempt/30)..."
            sleep 10
          done
          echo "The EC2 instance did not become available in Session Manager." >&2
          exit 1

      - name: Deploy through AWS Systems Manager
        env:
          INSTANCE_ID: ${{ needs.provision.outputs.instance-id }}
        run: |
          cat > ssm-commands.json <<EOF
          {
            "commands": [
              "set -eu",
              "cloud-init status --wait",
              "install -d /opt/atelier-maitre",
              "if [ ! -d /opt/atelier-maitre/repo/.git ]; then git clone --no-checkout https://github.com/EagleFox31/atelier2026.git /opt/atelier-maitre/repo; fi",
              "git -C /opt/atelier-maitre/repo fetch --depth 1 origin ${DEPLOY_SHA}",
              "git -C /opt/atelier-maitre/repo checkout --force ${DEPLOY_SHA}",
              "chmod +x /opt/atelier-maitre/repo/deploy/scripts/aws-ssm-deploy.sh",
              "/opt/atelier-maitre/repo/deploy/scripts/aws-ssm-deploy.sh"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Atelier Maitre ${DEPLOY_SHA}" \
            --parameters file://ssm-commands.json \
            --query 'Command.CommandId' \
            --output text)

          FINAL_STATUS=""
          for attempt in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)
            case "$STATUS" in
              Success)
                FINAL_STATUS="$STATUS"
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                FINAL_STATUS="$STATUS"
                break
                ;;
            esac
            echo "Deployment command status: ${STATUS:-Pending} ($attempt/240)"
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}'

          if [ "$FINAL_STATUS" != "Success" ]; then
            exit 1
          fi

      - name: Publish deployment URL
        env:
          PUBLIC_IP: ${{ needs.provision.outputs.public-ip }}
        run: |
          echo "### Atelier Maitre deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Temporary URL: http://$PUBLIC_IP" >> "$GITHUB_STEP_SUMMARY"
