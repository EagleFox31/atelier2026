name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Détection des changements ─────────────────────────────────────────────────
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'src/**'
              - 'server.ts'
              - 'prisma/**'
              - 'scripts/**'
              - 'tsconfig.server*.json'
              - 'deploy/docker/Dockerfile.api'
              - 'package.json'
              - 'package-lock.json'
            web:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - 'contexts/**'
              - 'hooks/**'
              - 'public/**'
              - 'styles/**'
              - 'deploy/docker/Dockerfile.web'
              - 'next.config.*'
              - 'tailwind.config.*'
              - 'package.json'
              - 'package-lock.json'

  # ── Build & push — uniquement les images modifiées ───────────────────────────
  build-push:
    name: Build & push → GHCR
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image names + version
        run: |
          OWNER="${{ github.repository_owner }}"
          git fetch --tags --force
          VERSION=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | head -n1)
          echo "API_IMAGE=ghcr.io/${OWNER,,}/atelier2026-api" >> $GITHUB_ENV
          echo "WEB_IMAGE=ghcr.io/${OWNER,,}/atelier2026-web" >> $GITHUB_ENV
          echo "APP_VERSION=${VERSION:-dev}" >> $GITHUB_ENV
          echo "Version détectée : ${VERSION:-dev}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QEMU supprimé — on build seulement linux/amd64 (natif sur runner)
      # Le serveur Oracle ARM64 fait tourner les images amd64 via compatibilité
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        if: ${{ needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          push: true
          platforms: linux/amd64
          tags: ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Web image
        if: ${{ needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          push: true
          platforms: linux/amd64
          tags: ${{ env.WEB_IMAGE }}:latest
          build-args: NEXT_PUBLIC_APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ── Deploy ────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    needs: build-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 94.237.59.178 >> ~/.ssh/known_hosts

      - name: Write .env.prod on server
        run: |
          echo "${{ secrets.ENV_PROD }}" | \
            ssh -i ~/.ssh/deploy_key root@94.237.59.178 \
              "mkdir -p /opt/atelier2026/deploy && cat > /opt/atelier2026/deploy/.env.prod"

      - name: Send docker-compose.prod.yml + Caddyfile + compose-prod.sh
        run: |
          ssh -i ~/.ssh/deploy_key root@94.237.59.178 \
            "mkdir -p /opt/atelier2026/deploy/docker /opt/atelier2026/deploy/scripts"
          scp -i ~/.ssh/deploy_key deploy/docker/docker-compose.prod.yml \
            root@94.237.59.178:/opt/atelier2026/deploy/docker/docker-compose.prod.yml
          scp -i ~/.ssh/deploy_key deploy/docker/Caddyfile \
            root@94.237.59.178:/opt/atelier2026/deploy/docker/Caddyfile
          scp -i ~/.ssh/deploy_key deploy/scripts/compose-prod.sh \
            root@94.237.59.178:/opt/atelier2026/deploy/scripts/compose-prod.sh

      - name: Pull images + restart + prune
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=10 \
              -i ~/.ssh/deploy_key root@94.237.59.178 << 'ENDSSH'
            set -e
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd /opt/atelier2026
            chmod +x deploy/scripts/compose-prod.sh
            ./deploy/scripts/compose-prod.sh pull api web
            ./deploy/scripts/compose-prod.sh up -d || {
              echo "=== LOGS API (dernières 150 lignes) ==="
              ./deploy/scripts/compose-prod.sh logs --no-log-prefix --tail=150 api
              exit 1
            }
            docker system prune -f
          ENDSSH

      - name: Check health
        run: |
          sleep 30
          curl --fail --retry 5 --retry-delay 10 \
            http://94.237.59.178/api/health \
            && echo "✅ API healthy" || echo "⚠️  Health check failed"

      - name: Container status
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key root@94.237.59.178 \
            "cd /opt/atelier2026 && chmod +x deploy/scripts/compose-prod.sh && ./deploy/scripts/compose-prod.sh ps"
