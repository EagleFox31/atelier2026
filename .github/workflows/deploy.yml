name: Deploy

# Déclenché après réussite du CI sur main (qui inclut semantic-release), ou manuellement
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Job 1 : build les images sur le runner GitHub et pousse vers GHCR ─────────
  build-push:
    name: Build & push → GHCR
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write   # nécessaire pour pousser vers ghcr.io

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nécessaire pour lire les tags git

      - name: Set image names + version (lowercase — GHCR l'exige)
        run: |
          OWNER="${{ github.repository_owner }}"
          git fetch --tags --force
          VERSION=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | head -n1)
          echo "API_IMAGE=ghcr.io/${OWNER,,}/atelier2026-api" >> $GITHUB_ENV
          echo "WEB_IMAGE=ghcr.io/${OWNER,,}/atelier2026-web" >> $GITHUB_ENV
          echo "APP_VERSION=${VERSION:-dev}" >> $GITHUB_ENV
          echo "Version détectée : ${VERSION:-dev}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          push: true
          tags: ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          push: true
          tags: ${{ env.WEB_IMAGE }}:latest
          build-args: NEXT_PUBLIC_APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ── Job 2 : le serveur pull les nouvelles images et redémarre ─────────────────
  deploy:
    name: Deploy to production
    needs: build-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 94.237.59.178 >> ~/.ssh/known_hosts

      - name: Write .env.prod on server
        run: |
          echo "${{ secrets.ENV_PROD }}" | \
            ssh -i ~/.ssh/deploy_key root@94.237.59.178 \
              "mkdir -p /opt/atelier2026/deploy && cat > /opt/atelier2026/deploy/.env.prod"

      - name: Send docker-compose.prod.yml + compose-prod.sh
        run: |
          ssh -i ~/.ssh/deploy_key root@94.237.59.178 \
            "mkdir -p /opt/atelier2026/deploy/docker /opt/atelier2026/deploy/scripts"
          scp -i ~/.ssh/deploy_key deploy/docker/docker-compose.prod.yml \
            root@94.237.59.178:/opt/atelier2026/deploy/docker/docker-compose.prod.yml
          scp -i ~/.ssh/deploy_key deploy/scripts/compose-prod.sh \
            root@94.237.59.178:/opt/atelier2026/deploy/scripts/compose-prod.sh

      - name: Pull images + restart + prune
        run: |
          ssh -i ~/.ssh/deploy_key root@94.237.59.178 << ENDSSH
            set -e
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd /opt/atelier2026
            chmod +x deploy/scripts/compose-prod.sh
            ./deploy/scripts/compose-prod.sh pull api web
            ./deploy/scripts/compose-prod.sh up -d
            docker system prune -f
          ENDSSH

      - name: Check health
        run: |
          sleep 30
          curl --fail --retry 5 --retry-delay 10 \
            http://94.237.59.178/api/health \
            && echo "✅ API healthy" || echo "⚠️  Health check failed"

      - name: Container status
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key root@94.237.59.178 \
            "cd /opt/atelier2026 && chmod +x deploy/scripts/compose-prod.sh && ./deploy/scripts/compose-prod.sh ps"
