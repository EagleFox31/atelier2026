name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Type-check & Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write       # semantic-release crée des tags git
      issues: write         # semantic-release commente les issues
      pull-requests: write  # semantic-release commente les PRs

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # historique complet nécessaire pour semantic-release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check backend
        run: npx tsc --noEmit -p tsconfig.server.json

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --ci --passWithNoTests
        env:
          DATABASE_URL: postgresql://fake:fake@localhost:5432/fake
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      # Versioning automatique — uniquement sur push main (pas les PRs)
      # feat: → minor bump  |  fix: → patch  |  feat!: → major
      - name: Semantic release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
