name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Type-check & Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write       # semantic-release crée des tags git
      issues: write         # semantic-release commente les issues
      pull-requests: write  # semantic-release commente les PRs

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # historique complet nécessaire pour semantic-release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check backend
        run: npx tsc --noEmit -p tsconfig.server.json

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --ci --passWithNoTests
        env:
          DATABASE_URL: postgresql://fake:fake@localhost:5432/fake
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      # Versioning automatique — uniquement sur push main (pas les PRs)
      # feat: → minor bump  |  fix: → patch  |  feat!: → major
      #
      # Certains anciens tags v* appartiennent à un historique Git divergent.
      # Dans ce cas semantic-release croit qu'il n'existe aucune release sur main
      # puis tente de recréer v1.0.0, ce qui fait échouer toute la CI et bloque
      # le workflow de déploiement AWS. On ne laisse donc pas le versioning
      # secondaire bloquer une CI dont les tests sont verts.
      - name: Check release tag history
        id: release-history
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          git fetch --tags --force
          LATEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n1 || true)"

          if [ -z "$LATEST_TAG" ]; then
            echo "run_release=true" >> "$GITHUB_OUTPUT"
            echo "No existing semantic version tag; semantic-release can bootstrap."
          elif git merge-base --is-ancestor "$LATEST_TAG" HEAD; then
            echo "run_release=true" >> "$GITHUB_OUTPUT"
            echo "$LATEST_TAG is reachable from main; semantic-release can run."
          else
            echo "run_release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping semantic-release because latest tag $LATEST_TAG is on divergent history. Tests remain authoritative for CI/deploy."
          fi

      - name: Semantic release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.release-history.outputs.run_release == 'true'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
